# Redis for Mere Mortals — lab instance configuration
#
# This is the configuration the guide's lab instance was
# actually started with. The paths point at the build lab's
# folder; point dir, logfile, and pidfile at your own
# scratch folder before you use it.
#
# The lab instance deliberately does NOT use Redis's
# standard port. Port 6379 belongs to any real install on
# the machine; the lab lives on 6399 so the two never meet.

port 6399
bind 127.0.0.1 -::1
protected-mode yes
daemonize yes

dir /home/hatch/workspace/redis-lab/data-main
dbfilename dump.rdb
logfile /home/hatch/workspace/redis-lab/redis-lab.log
pidfile /home/hatch/workspace/redis-lab/redis-lab.pid

# RDB snapshots: the distribution defaults.
save 900 1
save 300 10
save 60 10000
appendonly no

# No memory ceiling in the main lab instance.
maxmemory 0
maxmemory-policy noeviction
