site_name: Redis for Mere Mortals
site_description: Plain-language Redis. An in-memory store run as a small service on a throwaway lab port — keys, expiry, hashes, queues, leaderboards, persistence restarted and read back three ways, memory limits with a climbing eviction counter, and the honest chapter on why it is not your database.
site_url: https://paulsullivan33-dev.github.io/redis-for-mere-mortals/
